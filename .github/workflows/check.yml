name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog updates
        shell: pwsh
        env:
          CHANGELOG_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/changelog.ps1 -BaseRef $env:CHANGELOG_BASE
      - name: Changelog regression tests
        shell: pwsh
        run: ./tests/Changelog.Tests.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/PomodoroBar.csproj -c Dev
      - run: dotnet run --project tests/PomodoroBar.Tests.csproj -c Release
